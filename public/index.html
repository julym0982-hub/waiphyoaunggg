<!DOCTYPE html>
<html lang="my" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Padauk & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        },
                        accent: {
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    },
                    fontFamily: {
                        sans: ['Padauk', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Padauk', 'Inter', sans-serif;
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="h-full text-slate-800 flex flex-col min-h-screen">

    <!-- TOP NAVIGATION BAR -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo & Brand Name -->
                <div class="flex items-center gap-3">
                    <div class="bg-gradient-to-r from-sky-500 to-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                        <i class="fa-solid font-bold text-xl fa-store"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-slate-900 tracking-tight leading-tight" id="brandName">စိန်ဂေဟာ Store</h1>
                        <p class="text-xs text-slate-500 font-medium" id="brandTag"></p>
                    </div>
                </div>

                <!-- Right Action Navigation Buttons -->
                <div class="flex items-center gap-2 sm:gap-4">
                    <!-- Customer Cart Button -->
                    <button id="cartBtn" onclick="toggleCartModal()" class="relative flex items-center gap-2 px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition duration-200 font-semibold text-sm">
                        <i class="fa-solid fa-cart-shopping text-sky-600 text-base"></i>
                        <span class="hidden sm:inline">ဈေးဝယ်ခြင်း</span>
                        <span id="cartBadge" class="bg-rose-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">0</span>
                    </button>

                    <a id="tgBtn" target="_blank" rel="noopener" class="hidden items-center gap-2 px-3.5 py-2 bg-sky-500 hover:bg-sky-600 text-white rounded-xl transition font-semibold text-sm"><i class="fa-brands fa-telegram text-base"></i><span class="hidden sm:inline">ဆက်သွယ်ရန်</span></a>
                    <button onclick="openTrack()" class="flex items-center gap-2 px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition font-semibold text-sm"><i class="fa-solid fa-truck-fast text-sky-600 text-base"></i><span class="hidden sm:inline">အော်ဒါစစ်ရန်</span></button>
                </div>
            </div>
        </div>
    </header>
    <div id="noticeBar" class="hidden"></div>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- ================= CUSTOMER VIEW ================= -->
        <section id="customerView" class="space-y-6">
            <!-- Hero Banner -->
            <div class="relative overflow-hidden rounded-2xl bg-gradient-to-r from-sky-600 to-indigo-700 text-white p-6 sm:p-8 shadow-lg">
                <div class="relative z-10 max-w-2xl">
                    <span class="bg-white/20 text-white text-xs px-3 py-1 rounded-full font-semibold inline-block mb-3 backdrop-blur-sm">📦 အိမ်ရောက်ငွေချေ စနစ်</span>
                    <h2 id="heroTitle" class="text-2xl sm:text-3xl font-bold leading-snug mb-2"></h2>
                    <p id="heroText" class="text-sky-100 text-sm sm:text-base"></p>
                </div>
                <i class="fa-solid fa-bag-shopping absolute -right-6 -bottom-6 text-9xl text-white/10 pointer-events-none"></i>
            </div>

            <!-- Filters & Search Bar -->
            <div class="flex flex-col md:flex-row gap-4 items-center justify-between bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <!-- Search Input -->
                <div class="relative w-full md:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="ပစ္စည်းအမည် ရှာဖွေရန်..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition">
                </div>

                <!-- Category Filters -->
                <div class="flex items-center gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 scrollbar-none" id="categoryFilters">
                    <!-- Dynamic categories injected by JS -->
                </div>
            </div>

            <!-- Product Grid -->
            <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
                <!-- Rendered dynamically -->
            </div>
        </section>


            </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-slate-200 mt-auto py-4 text-center text-xs text-slate-500">
        <p id="footerText"></p>
    </footer>


    <!-- ================= MODALS & DRAWERS ================= -->

    <!-- 1. CART DRAWER / MODAL -->
    <div id="cartModal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-sm transition-opacity flex justify-end">
        <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl animate-in slide-in-from-right duration-300">
            <!-- Modal Header -->
            <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping text-sky-600 text-lg"></i>
                    <h3 class="font-bold text-slate-800 text-base">ဝယ်ယူမည့် ပစ္စည်းများ</h3>
                </div>
                <button onclick="toggleCartModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Modal Body: Cart Items -->
            <div id="cartItemsList" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Dynamic Items -->
            </div>

            <!-- Checkout Form Section -->
            <div id="checkoutSection" class="border-t border-slate-200 p-4 bg-slate-50 space-y-3">
                <div class="space-y-1 text-sm text-slate-600">
                    <div class="flex justify-between"><span>ပစ္စည်းဖိုး</span><span id="cartSubtotal">0 Ks</span></div>
                    <div class="flex justify-between"><span>ပို့ခ</span><span id="cartDelivery">0 Ks</span></div>
                </div>
                <div class="flex justify-between text-base font-bold text-slate-900 pt-1">
                    <span>စုစုပေါင်း ကျသင့်ငွေ</span>
                    <span id="cartTotalAmount" class="text-sky-600">0 Ks</span>
                </div>

                <form id="orderForm" onsubmit="handlePlaceOrder(event)" class="space-y-3 pt-2">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">သင့်အမည် *</label>
                        <input type="text" id="custName" required maxlength="60" placeholder="ဥပမာ - မောင်မောင်" class="w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">ဖုန်းနံပါတ် *</label>
                        <input type="tel" id="custPhone" required maxlength="20" placeholder="09xxxxxxxxx" class="w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">ပို့ဆောင်ရမည့် လိပ်စာ *</label>
                        <textarea id="custAddress" required maxlength="300" rows="2" placeholder="မြို့နယ်၊ လမ်း၊ အိမ်နံပါတ် ဖြည့်ပါ" class="w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">မှတ်ချက် (မလိုပါက ကျော်ပါ)</label>
                        <input type="text" id="custNote" maxlength="300" placeholder="ဥပမာ - ညနေ ၅ နာရီနောက်ပိုင်း ပို့ပေးပါ" class="w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none">
                    </div>
                    <button id="orderSubmit" type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-xl shadow-md transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> အော်ဒါ အတည်ပြုမည် (Cash on Delivery)
                    </button>
                </form>
            </div>
        </div>
    </div>

        <!-- 3. ORDER SUCCESS RECEIPT MODAL -->
    <div id="orderSuccessModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 text-center shadow-2xl animate-in zoom-in-95 duration-200 space-y-4">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <div>
                <h3 class="text-xl font-bold text-slate-900">အော်ဒါ အောင်မြင်ပါသည်။</h3>
                <p class="text-xs text-slate-500 mt-1">လူကြီးမင်း၏ အော်ဒါကို ဆိုင်ရှင်ထံသို့ အောင်မြင်စွာ ပို့ဆောင်ပြီးပါပြီ။</p>
            </div>

            <div id="receiptContent" class="bg-slate-50 p-4 rounded-xl text-left text-xs space-y-2 border border-slate-200">
                <!-- Dynamic receipt details -->
            </div>

            <div id="contactBox" class="space-y-2 pt-2">
                <p class="text-xs font-semibold text-slate-600">ဆိုင်ရှင်ကို တိုက်ရိုက် ဆက်သွယ်လိုပါက-</p>
                <div id="contactBtns" class="grid grid-cols-1 gap-2"></div>
            </div>

            <button onclick="closeSuccessModal()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold text-sm rounded-xl transition mt-2">
                ပိတ်မည်
            </button>
        </div>
    </div>


<!-- 4. TRACK ORDER MODAL -->
    <div id="trackModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-slate-800"><i class="fa-solid fa-truck-fast text-sky-600 me-2"></i>အော်ဒါ အခြေအနေ စစ်ရန်</h3>
                <button onclick="closeTrack()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="doTrack(event)" class="space-y-2">
                <input id="trkId" required placeholder="အော်ဒါနံပါတ် (ORD-123456)" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-sky-500">
                <input id="trkPhone" required type="tel" placeholder="မှာယူစဉ်က ဖုန်းနံပါတ်" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-sky-500">
                <button class="w-full py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-bold text-sm rounded-xl">စစ်ဆေးမည်</button>
            </form>
            <div id="trkResult" class="text-sm"></div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
